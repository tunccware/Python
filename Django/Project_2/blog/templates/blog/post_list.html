{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>

    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>

<body>

    <h1>My Blog</h1>

    {% for post in posts %}

        <div class="post">

            <h2>
                <a href="{% url 'post_detail' post.id %}">
                    {{ post.title }}
                </a>
            </h2>

            <p>{{ post.content|truncatewords:20 }}</p>

            <small>{{ post.created_at }}</small>

            <br><br>

            <a class="read-more" href="{% url 'post_detail' post.id %}">
                Read more →
            </a>

        </div>

        <hr>

    {% endfor %}

</body>
</html>
