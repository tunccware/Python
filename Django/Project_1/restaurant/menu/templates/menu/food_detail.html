
{% extends "base.html" %}

{% block title %}
{{ food.name }}
{% endblock %}

{% block content %}

<div class="food">

    {% if food.image %}
        <img src="{{ food.image.url }}" alt="{{ food.name }}">
    {% endif %}

    <h1>{{ food.name }}</h1>

    <p class="price">
        {{ food.price }} ₺
    </p>

    <p>
        {{ food.description }}
    </p>

    <a href="{% url 'menu:food_list' %}">
        ← Back to menu
    </a>

</div>

{% endblock %}
